services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_DSN: postgres://orders:orders@db:5432/orders?sslmode=disable
      SERVER_PORT: 3000
      RATE_LIMIT_REQUESTS: 10
      RATE_LIMIT_WINDOW_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 5s
      retries: 5
